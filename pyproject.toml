[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pith-nav"
version = "0.4.0"
description = "Skeleton-first codebase navigation TUI: definitions, docstrings and outgoing calls, one file at a time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=0.80",
    "rich>=13",
    "grep-ast>=0.5",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-language-pack>=1.10",
]

[project.scripts]
pith = "pith.app:main"

[tool.hatch.build.targets.wheel]
packages = ["pith"]
artifacts = ["pith/queries/**"]
